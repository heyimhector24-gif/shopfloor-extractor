<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopfloor — handwritten shop paper, turned into clean data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9e7e2; --ink:#1c1f22; --sub:#4a4f57; --line:#cfcac0;
    --accent:#FFC400; --card:#ffffff; --flag-bg:rgba(255,148,43,.14); --flag:#b5560a;
    --ok:#2e7d5b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--ink)}
  input,select,textarea,button{font-family:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .mono{font-family:'IBM Plex Mono',monospace}

  header{
    position:sticky;top:0;z-index:20;background:var(--ink);color:#f2f0eb;
    padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:3px solid var(--accent);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:26px;height:26px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
  .brand .mark div{width:11px;height:11px;border:2px solid var(--ink)}
  .brand .name{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:17px;letter-spacing:1px}

  main{max-width:720px;margin:0 auto;padding:20px 16px 90px}

  .card{background:var(--card);border:1px solid var(--line);padding:18px 16px;margin-bottom:16px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:1.3px;color:var(--sub);margin-bottom:12px;text-transform:uppercase}

  .doctypes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .doctype-btn{
    flex:1 1 140px;background:var(--card);border:1.5px solid var(--line);padding:11px 8px;
    font-size:13.5px;font-weight:600;text-align:center;transition:border-color .12s,background .12s;
  }
  .doctype-btn.active{border-color:var(--ink);background:var(--ink);color:#f2f0eb}

  .drop{
    border:2px dashed var(--line);padding:26px 14px;text-align:center;transition:border-color .12s,background .12s;
  }
  .drop.over{border-color:var(--accent);background:rgba(255,196,0,.08)}
  .drop p{color:var(--sub);font-size:14px;margin:0 0 12px}
  .pickbtn{background:var(--ink);color:#f2f0eb;border:none;padding:11px 18px;font-weight:700;font-size:14px}
  .preview{margin-top:14px;display:flex;justify-content:center}
  .preview img{max-width:100%;max-height:280px;border:1px solid var(--line);display:block}
  .filename{margin-top:10px;font-size:13px;color:var(--sub);text-align:center}
  .clearbtn{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:13px;margin-left:8px}

  .extract-btn{
    width:100%;margin-top:16px;background:var(--ink);color:#f2f0eb;border:none;padding:16px;
    font-weight:700;font-size:15px;font-family:'IBM Plex Mono',monospace;letter-spacing:.3px;
  }
  .extract-btn:disabled{background:#b7b2a6;cursor:not-allowed}
  .status{margin-top:10px;font-size:13.5px;color:var(--sub);text-align:center;min-height:18px}
  .status.err{color:#b3402a;font-weight:600}

  .steps{display:flex;flex-direction:column;gap:10px;padding:10px 4px}
  .step{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
  .step.on{color:var(--ink);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
  .step.on .dot{background:var(--accent)}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .step.on{animation:pulse 1.1s ease-in-out infinite}

  .results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .results-head h2{font-family:'IBM Plex Mono',monospace;font-size:15px;margin:0}
  .rate{font-size:12.5px;color:var(--sub)}

  .field-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .field-row:last-child{border-bottom:none}
  .field-row.flagged{background:var(--flag-bg);margin:0 -10px;padding-left:10px;padding-right:10px}
  .field-label{font-size:12.5px;color:var(--sub);flex:0 0 44%}
  .field-val-wrap{flex:1;text-align:right}
  .field-val{font-size:15px;font-weight:600;word-break:break-word}
  .field-note{font-size:12px;color:var(--flag);margin-top:3px}
  .field-edit{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
  .field-edit input{border:1.5px solid var(--line);padding:6px 8px;font-size:14px;width:140px}
  .field-edit button{border:none;padding:6px 10px;font-size:12.5px;font-weight:700}
  .fe-save{background:var(--ink);color:#f2f0eb}
  .fe-cancel{background:none;color:var(--sub);text-decoration:underline}
  .edit-link{background:none;border:none;font-size:11.5px;color:var(--sub);text-decoration:underline;margin-top:3px}

  .sheet-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .sheet-actions button{flex:1 1 130px;border:none;padding:13px;font-weight:700;font-size:14px}
  .csv-btn{background:var(--ink);color:#f2f0eb}
  .newdoc-btn{background:var(--card);border:1.5px solid var(--line) !important;color:var(--ink)}

  .hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
  .hist-item:last-child{border-bottom:none}
  .hist-item b{display:block;font-size:14px}
  .hist-item small{color:var(--sub)}
  .empty{color:var(--sub);font-size:13.5px;text-align:center;padding:8px 0}

  @media print{
    header,.card:not(.printable),.sheet-actions,.edit-link{display:none !important}
    body{background:#fff}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"><div></div></div>
    <div class="name">SHOPFLOOR</div>
  </div>
</header>

<main>
  <section class="card" id="uploadCard">
    <div class="eyebrow">Document type</div>
    <div class="doctypes" id="doctypes">
      <button class="doctype-btn active" data-type="work_order">Work Order</button>
      <button class="doctype-btn" data-type="inspection">Inspection / QC</button>
      <button class="doctype-btn" data-type="incoming">Incoming Inspection</button>
    </div>

    <div class="drop" id="drop">
      <p id="dropText">Drop a photo of the document here, or</p>
      <button class="pickbtn" id="pickBtn" type="button">Choose photo</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="preview" id="previewWrap" style="display:none">
        <img id="previewImg" alt="Selected document photo">
      </div>
      <div class="filename" id="filenameRow" style="display:none"></div>
    </div>

    <button class="extract-btn" id="extractBtn" disabled>EXTRACT DATA</button>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="card" id="processingCard" style="display:none">
    <div class="steps">
      <div class="step" id="pStep0"><div class="dot"></div>Reading the photo</div>
      <div class="step" id="pStep1"><div class="dot"></div>Extracting fields</div>
      <div class="step" id="pStep2"><div class="dot"></div>Checking confidence on each field</div>
    </div>
  </section>

  <section class="card" id="resultsCard" style="display:none">
    <div class="results-head">
      <h2 id="resultsTitle" class="mono"></h2>
      <div class="rate" id="resultsRate"></div>
    </div>
    <div id="fieldsList"></div>
    <div class="sheet-actions">
      <button class="csv-btn" onclick="exportCSV()">Export CSV</button>
      <button class="newdoc-btn" onclick="resetUpload()">New document</button>
    </div>
  </section>

  <section class="card" aria-label="History">
    <div class="eyebrow">History — on this device</div>
    <div id="histList"><p class="empty">Documents you extract will save here.</p></div>
  </section>
</main>

<script>
const LS_HIST = 'sf_history';
const $ = id => document.getElementById(id);
let docType = 'work_order';
let photo = null;      // {b64, type, preview}
let currentFields = [];
let currentTitle = '';

const docTypeMeta = {
  work_order: 'Work Order',
  inspection: 'Inspection / QC Checklist',
  incoming: 'Incoming Inspection'
};

/* ---------- doc type selection ---------- */
$('doctypes').addEventListener('click', e=>{
  const btn = e.target.closest('.doctype-btn');
  if(!btn) return;
  docType = btn.dataset.type;
  document.querySelectorAll('.doctype-btn').forEach(b=>b.classList.toggle('active', b===btn));
});

/* ---------- file selection ---------- */
$('pickBtn').addEventListener('click', ()=> $('fileInput').click());
$('fileInput').addEventListener('change', e=> handleFile(e.target.files[0]));
const drop = $('drop');
;['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.add('over');}));
;['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop', e=> handleFile(e.dataTransfer.files[0]));

function handleFile(file){
  if(!file || !file.type.startsWith('image/')) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    const MAX = 1500;
    let {width:w, height:h} = img;
    if(Math.max(w,h) > MAX){ const sc = MAX/Math.max(w,h); w=Math.round(w*sc); h=Math.round(h*sc); }
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    const dataUrl = c.toDataURL('image/jpeg', .85);
    photo = { b64: dataUrl.split(',')[1], type:'image/jpeg', preview: dataUrl, name: file.name };
    $('previewImg').src = dataUrl;
    $('previewWrap').style.display = 'flex';
    $('dropText').textContent = 'Photo selected — choose a different one, or';
    $('filenameRow').style.display = 'block';
    $('filenameRow').innerHTML = escapeHtml(file.name) + ' <button class="clearbtn" onclick="clearPhoto()">Remove</button>';
    $('extractBtn').disabled = false;
    setStatus('');
  };
  img.onerror = ()=> setStatus("Couldn't read that image. Try a different photo.", true);
  img.src = url;
}
function clearPhoto(){
  photo = null;
  $('previewWrap').style.display='none';
  $('filenameRow').style.display='none';
  $('dropText').textContent = 'Drop a photo of the document here, or';
  $('extractBtn').disabled = true;
}

/* ---------- extraction ---------- */
function setStatus(msg, isErr){
  const s = $('status');
  s.textContent = msg || '';
  s.className = 'status' + (isErr ? ' err' : '');
}

$('extractBtn').addEventListener('click', async ()=>{
  if(!photo) return;
  $('uploadCard').style.display = 'none';
  $('resultsCard').style.display = 'none';
  $('processingCard').style.display = 'block';
  runStepAnimation();
  try{
    const resp = await fetch('/api/extract', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ docType, image: { data: photo.b64, media_type: photo.type } })
    });
    if(!resp.ok){
      const t = await resp.json().catch(()=>({}));
      throw new Error(t.error || 'The extraction service returned an error.');
    }
    const data = await resp.json();
    currentFields = data.fields || [];
    currentTitle = docTypeMeta[docType] + (photo.name ? ' — ' + photo.name : '');
    stopStepAnimation();
    $('processingCard').style.display = 'none';
    renderResults();
    saveToHistory();
  }catch(err){
    stopStepAnimation();
    $('processingCard').style.display = 'none';
    $('uploadCard').style.display = 'block';
    setStatus(err.message, true);
  }
});

let stepTimer = null;
function runStepAnimation(){
  const steps = [$('pStep0'), $('pStep1'), $('pStep2')];
  steps.forEach(s=>s.classList.remove('on'));
  let i = 0;
  steps[0].classList.add('on');
  stepTimer = setInterval(()=>{
    steps[i].classList.remove('on');
    i++;
    if(i < steps.length){ steps[i].classList.add('on'); }
  }, 1400);
}
function stopStepAnimation(){ if(stepTimer) clearInterval(stepTimer); }

/* ---------- results ---------- */
function renderResults(){
  $('resultsCard').style.display = 'block';
  $('resultsTitle').textContent = currentTitle;
  const total = currentFields.length;
  const flagged = currentFields.filter(f=>f.status==='flagged').length;
  $('resultsRate').textContent = total ? `${flagged}/${total} flagged for review` : '';

  $('fieldsList').innerHTML = currentFields.map((f,i)=>`
    <div class="field-row ${f.status==='flagged' ? 'flagged':''}">
      <div class="field-label">${escapeHtml(f.label)}</div>
      <div class="field-val-wrap" id="fv-${i}">
        ${fieldValueHtml(f, i)}
      </div>
    </div>`).join('');
}
function fieldValueHtml(f, i){
  return `
    <div class="field-val">${escapeHtml(f.value || '—')}</div>
    ${f.note ? `<div class="field-note">${escapeHtml(f.note)}</div>` : ''}
    <button class="edit-link" onclick="editField(${i})">${f.status==='flagged' ? 'verify / fix' : 'edit'}</button>
  `;
}
function editField(i){
  const f = currentFields[i];
  $('fv-' + i).innerHTML = `
    <div class="field-edit">
      <input type="text" id="editInput-${i}" value="${escapeAttr(f.value || '')}">
      <button class="fe-save" onclick="saveField(${i})">Save</button>
      <button class="fe-cancel" onclick="renderResults()">Cancel</button>
    </div>`;
  $('editInput-' + i).focus();
}
function saveField(i){
  const val = $('editInput-' + i).value;
  currentFields[i] = { ...currentFields[i], value: val, status: 'verified', note: null };
  renderResults();
  saveToHistory();
}
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function resetUpload(){
  clearPhoto();
  currentFields = []; currentTitle = '';
  $('resultsCard').style.display = 'none';
  $('uploadCard').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- CSV export ---------- */
function exportCSV(){
  const rows = [['Field','Value','Status','Note']];
  currentFields.forEach(f=> rows.push([f.label, f.value||'', f.status||'', f.note||'']));
  const csv = rows.map(r=> r.map(c=>{
    const s = String(c ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (currentTitle || 'shopfloor-extraction').replace(/[^a-z0-9-_ ]/gi,'') + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- history ---------- */
function loadHist(){ try{ return JSON.parse(localStorage.getItem(LS_HIST)) || []; }catch(e){ return []; } }
function saveToHistory(){
  const total = currentFields.length;
  const flagged = currentFields.filter(f=>f.status==='flagged').length;
  const entry = { id: Date.now(), title: currentTitle, date: new Date().toLocaleDateString(), total, flagged, docType };
  let h = loadHist();
  h.unshift(entry);
  h = h.slice(0, 30);
  localStorage.setItem(LS_HIST, JSON.stringify(h));
  renderHist();
}
function renderHist(){
  const h = loadHist();
  if(h.length === 0){ $('histList').innerHTML = '<p class="empty">Documents you extract will save here.</p>'; return; }
  $('histList').innerHTML = h.map(e=>`
    <div class="hist-item">
      <div><b>${escapeHtml(e.title)}</b><small>${escapeHtml(e.date)} · ${e.flagged}/${e.total} flagged</small></div>
    </div>`).join('');
}
renderHist();
</script>
</body>
</html>
